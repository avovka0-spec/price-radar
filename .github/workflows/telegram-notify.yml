name: telegram-notify
on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat_id получателя"
        required: true
        type: string
      text:
        description: "Текст сообщения (UTF-8)"
        required: true
        type: string
  # Fallback для токенов без scope workflow (достаточно scope repo).
  repository_dispatch:
    types: [telegram-notify]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Отправка сообщения в Telegram (UTF-8 через Node)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id }}
          TEXT: ${{ github.event.inputs.text || github.event.client_payload.text }}
        run: |
          node << 'NODE_EOF'
          const https = require("https");
          const payload = JSON.stringify({
            chat_id: process.env.CHAT_ID,
            text: process.env.TEXT,
            disable_web_page_preview: true,
          });
          const req = https.request({
            hostname: "api.telegram.org",
            path: "/bot" + process.env.BOT_TOKEN + "/sendMessage",
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8",
              "Content-Length": Buffer.byteLength(payload, "utf8"),
            },
          }, (res) => {
            let buf = "";
            res.on("data", (c) => (buf += c));
            res.on("end", () => { console.log(res.statusCode, buf); process.exit(res.statusCode === 200 ? 0 : 1); });
          });
          req.on("error", (e) => { console.error(e); process.exit(1); });
          req.write(payload, "utf8");
          req.end();
          NODE_EOF

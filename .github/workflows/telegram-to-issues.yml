name: telegram-to-issues
on:
  # Основной режим — Telegram webhook через Cloudflare Worker (docs/telegram-webhook.md).
  # Telegram не разрешает webhook и getUpdates одновременно (409 Conflict), поэтому
  # polling оставлен только для ручного запуска/отката. Раскомментируйте schedule
  # после deleteWebhook, если понадобится вернуться к опросу.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  # Плановый и ручной запуски не должны идти одновременно — иначе дубли Issues.
  group: telegram-to-issues
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Опрос Telegram и создание Issue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: avovka0-spec
          GH_REPO: price-radar
        run: node scripts/telegram-to-issues.mjs
      - name: Коммит offset
        # Выполняется даже при ошибке опроса: прогресс, сохранённый скриптом, не теряется.
        if: always()
        run: |
          git config user.name "tg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/telegram-offset.json
          if git diff --cached --quiet; then echo "no offset changes"; exit 0; fi
          git commit -m "data: telegram offset"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 3
          done
          echo "push failed after retries" >&2
          exit 1
